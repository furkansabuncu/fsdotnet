name: web

# Monorepo: yalnızca frontend'e dokunan değişikliklerde koş.
#
# `push` TETİKLEYİCİSİ BİLEREK YOK. `main`e giden her itme zaten `pages.yml`i
# çalıştırıyor ve o da aynı denetimlerin tamamını koşuyor — ikisi birden
# açıkken lint ve build her itmede iki kez koşuyor, iki ayrı rozet aynı şeyi
# söylüyordu. İş bölümü şu: bu dosya PR'ları denetler, `pages.yml` `main`i
# denetler ve yayınlar.
on:
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: React + TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      # Yayın artefaktı üretilmiyor: PR'da derlemenin GEÇMESİ isteniyor,
      # çıktısı değil. Yayınlanan paketi `pages.yml` kendisi üretiyor.
      - run: npm run build
