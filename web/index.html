<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Page metadata lives in src/shared/Seo.tsx, not here.

      React 19 hoists <title>, <meta> and <link> rendered inside components
      into the head. Declaring them here as well would produce two of each,
      and browsers keep the first — every route would then advertise the same
      title and description, which is the problem this file used to have.
    -->

    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Apply the stored theme before React mounts, so a dark-mode user
         never sees a white first paint. Reads the same key as useTheme.ts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('fsdotnet.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
