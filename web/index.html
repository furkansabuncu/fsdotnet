<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fsdev — Developer toolbox for the .NET ecosystem</title>
    <meta
      name="description"
      content="Fast, private developer tools for .NET and web developers. Everything runs in your browser unless a real compiler is required."
    />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Share card metadata. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="fsdev" />
    <meta property="og:title" content="fsdev — Developer toolbox for the .NET ecosystem" />
    <meta
      property="og:description"
      content="Oracle error lookup, IN (…) chunking past ORA-01795, bind substitution, encoding forensics. Everything runs in your browser."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="fsdev — Developer toolbox for the .NET ecosystem" />
    <meta
      name="twitter:description"
      content="Oracle error lookup, IN (…) chunking past ORA-01795, bind substitution, encoding forensics. Everything runs in your browser."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Apply the stored theme before React mounts, so a dark-mode user
         never sees a white first paint. Reads the same key as useTheme.ts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('fsdev.theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
